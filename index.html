<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
</head>
<body>
    <div class="game-container">
        <h1>Tic Tac Toe</h1>
        <div class="scores">
            <p id="player1">Player 1: 0</p>
            <p class="turn"></p>
            <p id="player2">Player 2: 0</p>
        </div>
        
        <div class="gameboard">
            <div class="play-again"><p></p></div>
            <div class="name-container">
                <form id="name-form">
                    <div class="form-row">
                        <label for="player1Name">Player 1</label>
                        <input type="text" id="player1Name" name="player1Name" placeholder="Type Player 1 Name" required />
                    </div>
                    <div class="form-row">
                        <label for="player2Name">Player 2</label>
                        <input type="text" id="player2Name" name="player2Name" placeholder="Type Player 2 Name" required />
                    </div>
                    <button type="submit">Play</button>
                </form>
            </div>
        </div>
        <button class="reset">Reset</button>
    </div>
</body>
</html>
